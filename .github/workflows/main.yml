name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Localizar projeto
        run: |
          echo "Arquivos no repositorio:"
          ls -lah

          ZIP=$(find . -maxdepth 1 -type f -name 'EsbocoBiblicoApp_v*.zip' | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: nenhum ZIP do projeto foi encontrado."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          rm -rf projeto
          mkdir projeto
          unzip -q "$ZIP" -d projeto

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK
        working-directory: projeto
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: EsbocoBiblico-APK
          path: projeto/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
